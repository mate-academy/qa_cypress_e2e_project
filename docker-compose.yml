version: '3'

services:

  apache:
    container_name: realworld_apache
    build:
      context: .
      dockerfile: .docker/apache.dockerfile
    volumes:
      - ./src:/var/www/src
    working_dir: /var/www/src
    depends_on:
      - drash
    ports:
      - "8080:80"
    networks:
      - drash-app-network

  postgres:
    image: "postgres:11"
    container_name: "realworld_postgres"
    ports:
      - "54320:5432"
    volumes:
      - ./.docker/data:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=userpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d realworld"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - drash-app-network

  drash:
    container_name: realworld_drash
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: .docker/drash.dockerfile
    volumes:
      - ./src:/var/www/src
    working_dir: /var/www/src
    ports:
      - "1667:1667"
    command: bash -c "npm i && npm run webpack & deno run --allow-net --allow-read --allow-env --unstable app.ts"
    networks:
      - drash-app-network

networks:
  drash-app-network:
    driver: bridge