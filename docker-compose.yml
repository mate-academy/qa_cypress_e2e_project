services:

  postgres:
    image: "postgres:11"
    container_name: "realworld_postgres"
    ports:
      - "54320:5432"
    volumes:
      - ./.docker/data:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=userpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d realworld"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - drash-app-network

  drash:
    container_name: realworld_drash
    build:
      context: .
      dockerfile: .docker/drash.dockerfile
    ports:
      - "1667:1667"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1667/ > /dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - drash-app-network

  apache:
    container_name: realworld_apache
    build:
      context: .
      dockerfile: .docker/apache.dockerfile
    depends_on:
      drash:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    networks:
      - drash-app-network

networks:
  drash-app-network:
    driver: bridge
