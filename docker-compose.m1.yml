services:

  apache:
    container_name: realworld_apache
    build:
      context: .
      dockerfile: .docker/apache.dockerfile
    volumes:
      - ./src:/var/www/src
    working_dir: /var/www/src
    depends_on:
      - drash
    ports:
      - "8080:80"
    networks:
      - drash-app-network

  postgres:
    image: "postgres:11"
    container_name: "realworld_postgres"
    ports:
      - "54320:5432"
    volumes:
      - ./.docker/data:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=userpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - drash-app-network

  drash:
    container_name: realworld_drash
    build:
      context: .
      dockerfile: .docker/drash-m1.dockerfile
    volumes:
      - ./src:/var/www/src
      - node_modules:/var/www/src/node_modules
    working_dir: /var/www/src
    ports:
      - "1667:1667"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "npm run webpack:build &&
      deno run --allow-net --allow-read --unstable app.ts"
    networks:
      - drash-app-network

networks:
  drash-app-network:
    driver: bridge

volumes:
  node_modules:
