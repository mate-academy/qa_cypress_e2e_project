name: Cypress E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [e2e_testing]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Start application and database
        run: docker compose up --build -d
      - name: Wait for the compiled application
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:1667/ > /dev/null &&
               curl --fail --silent http://localhost:1667/public/js/app.js > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm test
      - name: Upload Cypress evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-evidence
          path: |
            cypress/screenshots
            cypress/videos
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs
          docker compose down
